name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: 22
            timezone: UTC
          - node: 24
            timezone: Europe/Berlin
          - node: 24
            timezone: America/Los_Angeles
          - node: 24
            timezone: Asia/Seoul
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: cmp siaivo-dorama.js d.js
      - run: npm test
